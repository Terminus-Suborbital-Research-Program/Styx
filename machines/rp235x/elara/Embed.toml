[default.general]
chip = "rp235x"

[default.flashing]
enabled = true

[default.reset]
enabled = true
halt_afterwards = false

[default.probe]
protocol = "Swd"
speed = 100

[default.rtt]
enabled = true
up_channels = [
  { channel = 0, mode = "NoBlockSkip", format = "String", name = "print" },
  { channel = 1, mode = "NoBlockSkip", format = "String", name = "telemetry", socket = "127.0.0.1:12346" }
]

tabs = [
  { up_channel = 0, name = "print" },
  { up_channel = 1, name = "telemetry" }
]